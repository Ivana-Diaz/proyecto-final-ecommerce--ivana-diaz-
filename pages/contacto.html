<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../css/style.css">
        <link href="https://fonts.googleapis.com/css2?family=Lobster&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
        <title>Carrito - Tienda Blue</title>

    <body>
        <header>
            <p class="header-logo">
                <a href="../index.html">Tienda Blue</a>
            </p>
            <nav class="header-nav">
                <ul>
                    <li><a href="../index.html">Home</a></li>
                    <li><a href="./contacto.html">Contacto</a></li>
                    <li><a href="./carrito.html">🛒<span id="contador-carrito">0</span></a></li>
                </ul>
            </nav>
        </header>
        <main>
            <section class="seccion-contacto">
                <h1 class="titulo-contacto">Contacto</h1>
                <form class="form" action="https://formspree.io/f/mnnblbgy" method="POST">
                    <div class="campo-form">
                        <label for="email">Correo:</label>
                        <input type="email" id="email" name="email">
                    </div>

                    <div class="campo-form">
                        <label for="mensaje"> Mensaje:</label>
                        <textarea id="mensaje" name="message" rows="4"></textarea>
                    </div>

                    <input type="hidden" name="subject" value="Contacto desde el sitio">
                    <button type="submit">Enviar</button>
                </form>
            </section>
        </main>
        <footer>
            <p>Página diseñada por Ivana.</p>
            <nav class="footer-nav">

                </ul>
            </nav>
        </footer>
        <script type="module" src="../js/index.js"></script>
